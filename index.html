<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Oxygen Factory</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Fredoka', 'sans-serif'] },
                    colors: { 'brand-yellow': '#FFD700', 'brand-green': '#4ADE80', 'brand-blue': '#60A5FA' }
                }
            }
        }
    </script>

    <style>
        .animate-spin-slow {
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .earth-pulse {
            animation: pulse-slow 3s ease-in-out infinite;
        }

        @keyframes pulse-slow {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @keyframes windFlow {
            from {
                transform: translateX(-100px);
                opacity: 0;
            }

            to {
                transform: translateX(1000px);
                opacity: 1;
            }
        }

        .animate-wind-flow {
            animation: windFlow 3s linear infinite;
        }

        @keyframes carMove {
            from {
                left: 1000px;
            }

            to {
                left: -1000%;
            }
        }

        .car-move {
            position: absolute;
            animation: carMove 5s linear infinite;
        }

        .car-move-delayed {
            position: absolute;
            animation: carMove 5s linear infinite 2.5s;
        }

        .animate-turbine-spin {
            animation: turbineSpin 1.5s linear infinite;
        }

        @keyframes turbineSpin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        [v-cloak] {
            display: none;
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-blue-200 to-purple-200 min-h-screen text-slate-800 overflow-hidden font-sans select-none">
    <div id="app" v-cloak class="relative w-full h-screen flex flex-col items-center justify-center p-4">
        <div class="relative z-10 w-full max-w-4xl bg-white/80 backdrop-blur-md rounded-3xl shadow-2xl border-4 border-white overflow-hidden flex flex-col transition-all duration-500"
            style="height: 600px;">
            <div class="h-16 bg-brand-green flex items-center justify-between px-6 shadow-md z-50">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">🧬</span>
                    <h1 class="text-xl font-bold text-white tracking-wide">The Oxygen Factory</h1>
                </div>
                <div class="flex items-center gap-4 text-white font-bold">
                    <button @click="toggleMusic"
                        class="bg-white/20 hover:bg-white/30 w-10 h-10 rounded-full transition-colors flex items-center justify-center text-xl shadow-inner"
                        title="Toggle Music">
                        {{ isMusicPlaying ? '🔊' : '🔇' }}
                    </button>
                    <template v-if="playerName">
                        <div class="bg-white/20 px-4 py-1 rounded-full text-sm sm:text-base">Explorer: {{ playerName }}</div>
                        <div class="bg-white/20 px-4 py-1 rounded-full">⭐ {{ score }}</div>
                    </template>
                </div>
            </div>

            <div class="flex-1 relative overflow-hidden bg-sky-100">
                    <div v-if="currentStage === 0"
                        class="absolute inset-0 flex flex-col items-center justify-center p-8 text-center z-[100] bg-gradient-to-b from-sky-300 via-blue-100 to-green-50 overflow-hidden animate__animated animate__fadeIn">
                        <div
                            class="relative z-10 bg-white/70 backdrop-blur-md p-10 rounded-[40px] shadow-2xl border-4 border-white max-w-lg w-full">
                            <div class="mb-4 text-7xl animate-bounce">🌱</div>
                            <h2 class="text-4xl font-black text-slate-800 mb-2">OXYGEN FACTORY</h2>
                            <p class="text-slate-600 mb-8 font-medium">Hero, we need your help to save the Earth!</p>
                            <input v-model="playerNameInput" @keyup.enter="startGame" type="text"
                                placeholder="Enter your hero name..."
                                class="w-full text-center py-4 rounded-2xl border-4 border-slate-200 focus:border-brand-green outline-none mb-4 text-xl">
                            <button @click="startGame" :disabled="!playerNameInput"
                                class="w-full py-4 rounded-2xl bg-brand-green text-white text-2xl font-bold shadow-[0_6px_0_#15803d] active:translate-y-1 active:shadow-none transition-all disabled:opacity-50">
                                START MISSION 🚀
                            </button>
                        </div>
                    </div>

                    <div v-if="currentStage === 0.5"
                        class="absolute inset-0 flex flex-col items-center justify-center p-8 animate__animated animate__fadeIn bg-sky-100 z-20">

                        <h2 class="text-3xl font-bold text-slate-700 mb-4 text-center">Pick your Mission, {{ playerName
                            }}!
                        </h2>

                        <div v-if="lastScore !== null"
                            class="mb-8 px-8 py-3 bg-white/70 backdrop-blur-md rounded-full shadow-lg border-2 border-brand-yellow flex items-center justify-center gap-3 animate__animated animate__zoomIn">
                            <span class="text-xl font-bold text-slate-600">Last Score:</span>
                            <span class="text-2xl font-black text-brand-yellow drop-shadow-md">⭐ {{ lastScore }}</span>
                        </div>

                        <div class="flex flex-col sm:flex-row gap-6 w-full max-w-4xl">
                            <button @click="selectPath('photosynthesis')"
                                :disabled="completedPaths.includes('photosynthesis')"
                                class="relative flex-1 bg-white p-6 rounded-3xl border-4 transition-all shadow-xl"
                                :class="completedPaths.includes('photosynthesis') ? 'grayscale opacity-60 cursor-not-allowed border-slate-300 bg-slate-100' : 'border-brand-green hover:scale-105'">
                                <div v-if="completedPaths.includes('photosynthesis')"
                                    class="absolute -top-4 -right-4 w-12 h-12 bg-green-500 rounded-full border-4 border-white flex items-center justify-center text-white text-2xl animate__animated animate__bounceIn shadow-lg z-10">
                                    ✔️</div>
                                <div class="text-6xl mb-4"
                                    :class="completedPaths.includes('photosynthesis') ? 'opacity-50' : ''">🌿</div>
                                <h3 class="text-2xl font-bold"
                                    :class="completedPaths.includes('photosynthesis') ? 'text-slate-500' : 'text-brand-green'">
                                    Photosynthesis</h3>
                                <p class="text-slate-500 mt-2">Learn how plants make food and oxygen!</p>
                            </button>

                            <button @click="selectPath('greenhouse')" :disabled="completedPaths.includes('greenhouse')"
                                class="relative flex-1 bg-white p-6 rounded-3xl border-4 transition-all shadow-xl"
                                :class="completedPaths.includes('greenhouse') ? 'grayscale opacity-60 cursor-not-allowed border-slate-300 bg-slate-100' : 'border-orange-400 hover:scale-105'">
                                <div v-if="completedPaths.includes('greenhouse')"
                                    class="absolute -top-4 -right-4 w-12 h-12 bg-green-500 rounded-full border-4 border-white flex items-center justify-center text-white text-2xl animate__animated animate__bounceIn shadow-lg z-10">
                                    ✔️</div>
                                <div class="text-6xl mb-4"
                                    :class="completedPaths.includes('greenhouse') ? 'opacity-50' : ''">🌡️</div>
                                <h3 class="text-2xl font-bold"
                                    :class="completedPaths.includes('greenhouse') ? 'text-slate-500' : 'text-orange-500'">
                                    Greenhouse Effect</h3>
                                <p class="text-slate-500 mt-2">Help balance the Earth's temperature!</p>
                            </button>

                            <button @click="selectPath('aquamarine')" :disabled="completedPaths.includes('aquamarine')"
                                class="relative flex-1 bg-white p-6 rounded-3xl border-4 transition-all shadow-xl"
                                :class="completedPaths.includes('aquamarine') ? 'grayscale opacity-60 cursor-not-allowed border-slate-300 bg-slate-100' : 'border-cyan-400 hover:scale-105'">
                                <div v-if="completedPaths.includes('aquamarine')"
                                    class="absolute -top-4 -right-4 w-12 h-12 bg-green-500 rounded-full border-4 border-white flex items-center justify-center text-white text-2xl animate__animated animate__bounceIn shadow-lg z-10">
                                    ✔️</div>
                                <div class="text-6xl mb-4"
                                    :class="completedPaths.includes('aquamarine') ? 'opacity-50' : ''">🌊</div>
                                <h3 class="text-2xl font-bold"
                                    :class="completedPaths.includes('aquamarine') ? 'text-slate-500' : 'text-cyan-500'">
                                    Aquamarine</h3>
                                <p class="text-slate-500 mt-2">Protect our oceans and coral reefs!</p>
                            </button>
                        </div>

                    </div>

                    <template v-if="selectedPath === 'photosynthesis'">
                        <div class="absolute inset-0 bg-gradient-to-b from-sky-300 via-blue-200 to-green-100">
                            <div class="absolute top-10 right-10 text-8xl transition-all duration-1000"
                                :class="sunRevealed || currentStage > 1 ? 'animate-spin-slow opacity-100 scale-110 drop-shadow-2xl' : 'grayscale opacity-30'">
                                ☀️</div>

                            <div
                                class="absolute bottom-0 w-full h-32 bg-gradient-to-t from-[#3d1f06] to-[#5D2E0C] z-10">
                            </div>
                            <div class="absolute bottom-28 w-full h-8 z-20 flex justify-around px-2">
                                <div v-for="n in 25" :key="'grass-'+n"
                                    class="w-3 h-12 bg-green-500 rounded-t-full origin-bottom animate-bounce"
                                    :style="{ animationDuration: (2 + Math.random() * 2) + 's', animationDelay: (Math.random()) + 's' }">
                                </div>

                            </div>

                        </div>


                        <div v-if="currentStage === 1" class="absolute inset-0 z-30 overflow-hidden">
                            <div
                                class="absolute top-20 right-6 w-12 h-48 bg-gray-200 rounded-full border-4 border-white shadow-xl overflow-hidden">
                                <div class="absolute bottom-0 w-full bg-yellow-400 transition-all duration-300"
                                    :style="{ height: sunPower + '%' }"></div>
                            </div>
                            <div class="absolute top-14 right-6 font-bold text-slate-700">SUN ENERGY</div>

                            <div v-for="(cloud, index) in clouds" :key="'c1-'+index" v-show="!cloud.cleared"
                                @click="clearCloud(index)"
                                class="absolute text-9xl cursor-pointer hover:scale-110 transition-all z-50 animate-pulse"
                                :style="{ 
                                top: cloud.top, 
                                left: cloud.left, 
                                transition: 'left 0s linear' 
                            }">
                                {{ cloud.isAcid ? '🌧️' : '☁️' }}
                            </div>

                            <div @click="plantSeed"
                                class="absolute bottom-32 left-1/2 -translate-x-1/2 text-[120px] transition-all"
                                :class="[sunPower < 60 ? 'grayscale opacity-50 cursor-not-allowed' : 'cursor-pointer hover:scale-110 active:scale-95']">
                                {{ seedPlanted ? '🌱' : '🌰' }}
                                <div v-if="sunPower < 60"
                                    class="text-xs bg-black/50 text-white p-2 rounded absolute top-0 w-32 -left-4">Needs
                                    80%
                                    Sun!</div>
                            </div>
                        </div>


                        <div v-if="currentStage === 2"
                            class="absolute inset-0 bg-gradient-to-b from-blue-300 to-green-100 z-30 overflow-hidden">

                            <div class="absolute top-10 left-10 text-8xl animate-spin-slow">☀️</div>
                            <div class="absolute bottom-32 left-1/2 -translate-x-1/2 transition-all duration-1000">
                                <div :class="trashClearedCount >= 2 ? 'scale-125' : 'scale-100'"
                                    class="text-[120px] transition-transform">
                                    🌱
                                </div>
                                <div :class="allTrashCleared ? 'bg-amber-800' : 'bg-slate-600'"
                                    class="w-32 h-6 rounded-full mt-2 transition-colors duration-1000 mx-auto"></div>
                            </div>

                            <div
                                class="absolute bottom-20 left-0 right-0 flex justify-around opacity-30 text-5xl pointer-events-none select-none">
                                <span>🪵</span><span>🪵</span><span>🪵</span><span>🪵</span><span>🪵</span><span>🪵</span><span>🪵</span>
                            </div>

                            <div
                                class="absolute bottom-0 left-0 right-0 h-24 bg-green-400/40 backdrop-blur-[1px] pointer-events-none">
                                <div class="absolute bottom-6 left-[10%] text-4xl animate-bounce"
                                    style="animation-duration: 3s;">🌸</div>
                                <div class="absolute bottom-4 left-[15%] text-3xl opacity-80">🌿</div>

                                <div class="absolute bottom-5 right-[12%] text-4xl animate-bounce"
                                    style="animation-duration: 2.5s; animation-delay: 0.5s;">🌻</div>
                                <div class="absolute bottom-4 right-[8%] text-3xl opacity-80">🌿</div>

                                <div class="absolute bottom-2 left-[30%] text-2xl opacity-60">🌱</div>
                                <div class="absolute bottom-2 right-[35%] text-2xl opacity-60">🌱</div>
                            </div>

                            <div v-for="(item, i) in trash" :key="'trash-'+i" v-show="!item.cleared"
                                @click="cleanTrash(i)"
                                class="absolute cursor-pointer text-6xl hover:scale-125 hover:rotate-12 transition-all z-40"
                                :style="{ top: item.top + '%', left: item.left + '%' }">
                                {{ item.icon }}
                            </div>

                            <div class="game-container">
                                <div 
                                    v-for="(item, index) in trash" 
                                    :key="index"
                                    class="trash-item"
                                    :class="{ 'glow': item.isGlowing }"
                                    :style="{ top: item.top + '%', left: item.left + '%' }"
                                    @touchstart="item.isGlowing = true"
                                    @touchend="item.isGlowing = false"
                                    @mouseenter="item.isGlowing = true"
                                    @mouseleave="item.isGlowing = false"
                                >
                                    {{ item.icon }}
                                </div>
                                </div>

                            <div
                                class="absolute top-24 left-1/2 -translate-x-1/2 bg-white/50 px-6 py-2 rounded-full border-2 border-brand-green font-bold z-50">
                                🧹 Trash is Cleaned: {{ trashClearedCount }} / {{ trash.length }}
                            </div>


                        </div>


                        <div v-if="currentStage === 3" class="absolute inset-0 z-30 cursor-none overflow-hidden"
                            @mousemove="updatePointerPos">

                            <div class="absolute top-20 left-10 flex gap-2 z-50">
                                <span v-for="n in beeHealth" class="text-3xl">❤️</span>
                            </div>

                            <div v-if="isConfused"
                                class="absolute inset-0 bg-green-500/20 pointer-events-none animate-pulse z-40 flex items-center justify-center">
                                <h2 class="text-4xl font-black text-green-700">DIZZY! CONTROLS REVERSED! 😵‍💫</h2>
                            </div>

                            <div v-for="bird in birds"
                                class="absolute text-7xl transition-all duration-100 pointer-events-none"
                                :style="{ left: bird.x + '%', top: bird.y + '%', transform: bird.speed > 0 ? 'scaleX(-1)' : 'scaleX(1)' }">
                                🦅
                            </div>

                            <div v-for="cloud in pesticideClouds"
                                class="absolute text-8xl opacity-40 animate-pulse pointer-events-none"
                                :style="{ left: cloud.x + '%', top: cloud.y + '%' }">
                                💨
                            </div>

                            <div class="pointer-events-none absolute z-50 text-6xl drop-shadow-lg transition-transform"
                                :class="isConfused ? 'rotate-180 scale-75' : ''"
                                :style="{ left: beeX + 'px', top: beeY + 'px' }">
                                🐝
                            </div>

                            <div v-for="(flower, fIndex) in flowers" :key="'flower-'+fIndex"
                                @mouseover="pollinateFlower(fIndex)" class="absolute p-4 transition-all"
                                :style="{ left: flower.x + '%', top: flower.y + '%' }">
                                <span class="text-7xl">{{ flower.pollinated ? '🌸' : '🌱' }}</span>
                            </div>
                        </div>


                        <div v-if="currentStage === 4" :class="{'animate-bounce': isStormy}"
                            class="absolute inset-0 bg-orange-50 overflow-hidden z-30">

                            <div
                                class="absolute top-8 right-12 text-8xl animate-spin-slow pointer-events-none select-none z-10">
                                ☀️
                            </div>

                            <div v-if="isStormy"
                                class="absolute inset-0 bg-blue-900/30 z-50 flex items-center justify-center">
                                <h2 class="text-6xl font-black text-white italic">STORM BREWING! ⛈️</h2>
                            </div>

                            <div class="absolute bottom-20 left-1/2 -translate-x-1/2 text-[300px] leading-none">🌳</div>

                            <div v-for="(fruit, i) in fruits" :key="'fruit-'+i" v-show="!fruit.harvested"
                                draggable="true" @dragstart="startDragFruit($event, i)"
                                class="absolute text-6xl cursor-grab active:cursor-grabbing z-40"
                                :style="{ left: fruit.x + '%', top: fruit.y + '%' }">
                                🍎
                            </div>

                            <div v-for="(pest, i) in pests" :key="'pest-'+i" v-show="pest.alive" @click="killPest(i)"
                                class="absolute text-5xl cursor-crosshair z-50 transition-all duration-100"
                                :style="{ left: pest.x + '%', top: pest.y + '%' }">
                                🐛
                            </div>

                            <div
                                class="absolute bottom-0 left-0 right-0 h-28 bg-gradient-to-t from-emerald-500 to-green-400 rounded-t-[100vw] scale-x-110 translate-y-10 z-10 pointer-events-none shadow-inner">
                                <div class="absolute -top-6 left-[20%] text-3xl opacity-80">🌳</div>
                                <div class="absolute -top-4 left-[25%] text-2xl opacity-60">🌲</div>
                                <div class="absolute -top-5 right-[22%] text-3xl opacity-80">🌳</div>
                            </div>

                            <div
                                class="absolute bottom-20 left-0 right-0 flex justify-around opacity-30 text-5xl pointer-events-none select-none">
                                <span>🪵</span><span>🪵</span><span>🪵</span><span>🪵</span><span>🪵</span><span>🪵</span><span>🪵</span>
                            </div>

                            <div @dragover.prevent @drop="onDropFruit"
                                class="absolute bottom-10 left-1/2 -translate-x-1/2 w-40 h-24 bg-amber-800 rounded-b-3xl border-t-4 border-amber-600 flex items-center justify-center text-5xl shadow-2xl z-30">
                                🧺
                                <span class="absolute -top-10 text-xl font-bold text-amber-900">{{ harvestedCount }} /
                                    3</span>
                            </div>

                        </div>

                    </template>


                    <template v-if="selectedPath === 'greenhouse'">

                        <div v-if="currentStage === 1" class="absolute inset-0 transition-colors duration-1000"
                            :class="stageComplete ? 'bg-sky-200' : 'bg-red-50'">

                            <div class="absolute inset-0 flex items-center justify-center z-0 pointer-events-none">

                                <div class="text-[400px] transition-all duration-1000 earth-pulse"
                                    :class="stageComplete ? 'opacity-100 scale-110 saturate-150' : 'opacity-40 grayscale-[20%]'">
                                    🌎</div>
                            </div>

                            <div
                                class="absolute top-[10%] left-[15%] text-2xl opacity-60 animate__animated animate__flash animate__infinite">
                                ✨</div>
                            <div class="absolute top-[15%] right-[20%] text-xl opacity-40 animate__animated animate__flash animate__infinite"
                                style="animation-delay: 2s;">⭐</div>
                            <div class="absolute bottom-[20%] left-[25%] text-xl opacity-50 animate__animated animate__flash animate__infinite"
                                style="animation-delay: 1s;">⭐</div>
                            <div class="absolute bottom-[15%] right-[15%] text-3xl opacity-70 animate__animated animate__flash animate__infinite"
                                style="animation-delay: 3s;">✨</div>
                            <div class="absolute top-[50%] left-[8%] text-2xl opacity-40 animate__animated animate__flash animate__infinite"
                                style="animation-delay: 1.5s;">✨</div>
                            <div class="absolute top-[45%] right-[10%] text-xl opacity-60 animate__animated animate__flash animate__infinite"
                                style="animation-delay: 3s;">⭐</div>

                            <div v-for="(gas, index) in greenhouseGases" :key="index" @click="clearGas(index)"
                                class="absolute text-7xl cursor-pointer animate__animated animate__pulse animate__infinite z-20"
                                :style="{ top: gas.top + '%', left: gas.left + '%' }">🫧</div>
                        </div>


                        <div v-if="currentStage === 2" class="absolute inset-0 bg-amber-50 flex flex-col">

                            <div
                                class="h-1/4 flex items-center justify-around bg-slate-200 border-b-4 border-slate-300 relative overflow-hidden">

                                <div
                                    class="absolute top-2 left-4 bg-white/80 px-4 py-1 rounded-full font-bold text-red-500 shadow-sm z-10">

                                    CO2 LEVEL: {{ co2Level }}%

                                </div>

                                <span class="text-6xl" :class="co2Level > 0 ? 'animate-bounce' : 'opacity-50'">🏭</span>
                                <span class="text-6xl"
                                    :class="co2Level > 30 ? 'animate-bounce' : 'opacity-50'">🏭</span>
                                <span class="text-6xl"
                                    :class="co2Level > 60 ? 'animate-bounce' : 'opacity-50'">🏭</span>

                            </div>


                            <div class="flex-1 p-6 grid grid-cols-5 gap-4 bg-green-50">

                                <div v-for="(spot, i) in plantingSpots" :key="i" @click="plantGreenhouseTree(i)"
                                    class="flex items-center justify-center border-4 border-dashed border-green-200 rounded-3xl hover:bg-white transition-all cursor-pointer group">
                                    <span class="text-6xl group-hover:scale-110 transition-transform">
                                        {{ spot.planted ? '🌳' : '🕳️' }}
                                    </span>
                                </div>

                            </div>

                            <div
                                class="h-28 bg-slate-700 relative overflow-hidden border-t-4 border-slate-800 flex items-center">
                                <div class="absolute w-full border-t-2 border-dashed border-yellow-400 h-1"></div>
                                <div class="car-container flex gap-20 absolute whitespace-nowrap">
                                    <span class="text-5xl car-move">🚗</span>
                                    <span class="text-5xl car-move-delayed">🚛</span>
                                    <span class="text-5xl car-move">🚌</span>
                                    <span class="text-5xl car-move">🚐</span>
                                </div>
                            </div>

                        </div>



                        <div v-if="currentStage === 3"
                            class="absolute inset-0 bg-gradient-to-b from-sky-300 to-blue-400 flex items-center justify-center gap-16 overflow-hidden">

                            <div class="absolute inset-0 pointer-events-none">
                                <div v-for="n in 6" :key="'wind-'+n"
                                    class="absolute h-1 bg-white/40 rounded-full animate-wind-flow" :style="{ 
                                    width: (Math.random() * 150 + 50) + 'px', 
                                    top: (Math.random() * 90) + '%', 
                                    left: '-200px',
                                    animationDelay: (Math.random() * 5) + 's',
                                    animationDuration: (2 + Math.random() * 2) + 's'
                                }">

                                </div>
                            </div>


                            <div v-for="n in 3" :key="n" @click="fixTurbine(n)"
                                class="relative flex flex-col items-center cursor-pointer group">

                                <div class="relative z-20 w-4 h-4 flex items-center justify-center transition-all duration-1000"
                                    :class="turbinesFixed.includes(n) ? 'animate-turbine-spin' : 'rotate-[15deg] grayscale opacity-60'">

                                    <div class="w-4 h-4 bg-slate-300 rounded-full shadow-md z-30"></div>
                                    <div
                                        class="absolute w-2 h-24 bg-gradient-to-t from-slate-100 to-white rounded-full origin-bottom -translate-y-12">
                                    </div>
                                    <div
                                        class="absolute w-2 h-24 bg-gradient-to-t from-slate-100 to-white rounded-full origin-bottom -translate-y-12 rotate-[120deg]">
                                    </div>
                                    <div
                                        class="absolute w-2 h-24 bg-gradient-to-t from-slate-100 to-white rounded-full origin-bottom -translate-y-12 rotate-[240deg]">
                                    </div>
                                </div>

                                <div class="w-10 h-6 bg-slate-400 rounded-lg -mt-2 shadow-md relative z-10"></div>
                                <div
                                    class="h-48 w-4 bg-gradient-to-b from-slate-300 to-slate-500 rounded-b-lg shadow-inner">
                                </div>

                                <div class="mt-6 px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest shadow-lg transition-all"
                                    :class="turbinesFixed.includes(n) ? 'bg-brand-green text-white scale-110' : 'bg-red-500 text-white animate-pulse'">
                                    {{ turbinesFixed.includes(n) ? 'Generating Power ⚡' : 'Broken / Click to Fix' }}
                                </div>
                            </div>

                            <div
                                class="absolute bottom-0 left-0 right-0 h-28 bg-gradient-to-t from-emerald-500 to-green-400 rounded-t-[100vw] scale-x-110 translate-y-10 z-10 pointer-events-none shadow-inner">
                                <div class="absolute -top-6 left-[20%] text-3xl opacity-80">🌳</div>
                                <div class="absolute -top-4 left-[25%] text-2xl opacity-60">🌲</div>
                                <div class="absolute -top-5 right-[22%] text-3xl opacity-80">🌳</div>
                            </div>

                        </div>


                        <div v-if="currentStage === 4"
                            class="absolute inset-0 bg-gradient-to-b from-cyan-200 via-sky-200 to-emerald-300 flex flex-col items-center justify-center overflow-hidden">
                            
                            <div class="absolute top-10 left-[10%] text-6xl opacity-30 select-none pointer-events-none animate-bounce">☁️</div>
                            <div class="absolute top-16 right-[15%] text-7xl opacity-20 select-none pointer-events-none">☁️</div>

                            <div class="absolute bottom-0 w-full h-32 bg-emerald-400 border-t-4 border-emerald-500/30 shadow-inner"></div>

                            <div class="absolute bottom-10 flex gap-12 z-0">
                                <div @dragover.prevent @drop="onDrop($event, 'paper')"
                                    class="flex flex-col items-center p-4 border-4 border-dashed border-blue-400 rounded-2xl bg-blue-100/50 hover:bg-blue-200 transition-colors">
                                    <div class="text-8xl select-none">🟦</div>
                                    <span class="font-bold text-blue-600 text-sm">PAPER</span>
                                </div>

                                <div @dragover.prevent @drop="onDrop($event, 'plastic')"
                                    class="flex flex-col items-center p-4 border-4 border-dashed border-orange-400 rounded-2xl bg-orange-100/50 hover:bg-orange-200 transition-colors">
                                    <div class="text-8xl select-none">🟧</div>
                                    <span class="font-bold text-orange-600 text-sm">PLASTIC</span>
                                </div>

                                <div @dragover.prevent @drop="onDrop($event, 'glass')"
                                    class="flex flex-col items-center p-4 border-4 border-dashed border-amber-800 rounded-2xl bg-amber-100/50 hover:bg-amber-200 transition-colors">
                                    <div class="text-8xl select-none">🤎</div>
                                    <span class="font-bold text-amber-800 text-sm">GLASS/METAL</span>
                                </div>

                            </div>

                            <div v-for="(item, index) in recyclableItems" :key="index" v-show="!item.sorted"
                                draggable="true" @dragstart="startDrag($event, index)"
                                class="absolute text-7xl cursor-grab active:cursor-grabbing z-20 animate__animated animate__fadeIn"
                                :style="{ top: item.top + '%', left: item.left + '%' }">

                                {{ item.icon }}

                            </div>

                            <p class="absolute top-20 text-xl font-bold text-slate-500 animate-pulse text-center">Drag the garbage to the right bin! ♻️</p>

                        </div>

                    </template>

                    <template v-if="selectedPath === 'aquamarine'">
                        <div
                            class="absolute inset-0 bg-gradient-to-b from-cyan-600 via-blue-800 to-slate-900 overflow-hidden">
                            <div
                                class="absolute inset-0 opacity-20 pointer-events-none bg-[url('https://www.transparenttextures.com/patterns/water-flea.png')] animate-pulse">
                            </div>

                            <div v-for="n in 15" :key="'bubble-'+n"
                                class="absolute rounded-full bg-white/20 border border-white/30 animate-bounce" :style="{ 
                                width: (Math.random() * 20 + 5) + 'px', 
                                height: (Math.random() * 20 + 5) + 'px',
                                left: (Math.random() * 100) + '%',
                                bottom: '-20px',
                                animationDuration: (3 + Math.random() * 5) + 's',
                                animationDelay: (Math.random() * 5) + 's'
                            }">
                            </div>
                        </div>

                        <div class="absolute top-4 left-4 z-50 flex flex-col gap-2">
                            <div
                                class="bg-black/60 backdrop-blur-md border-2 border-cyan-400 p-3 rounded-2xl text-cyan-400 font-mono shadow-lg">
                                <div class="text-xs uppercase opacity-70">Mission Timer</div>
                                <div class="text-2xl font-black">{{ gameTimer }}s</div>
                            </div>
                            <div v-if="currentStage === 4"
                                class="bg-black/60 backdrop-blur-md border-2 border-red-500 p-3 rounded-2xl text-red-500 font-mono shadow-lg">
                                <div class="text-xs uppercase opacity-70">Submarine Hull</div>
                                <div class="w-32 h-3 bg-red-900/50 rounded-full mt-1 overflow-hidden">
                                    <div class="h-full bg-red-500 transition-all duration-300"
                                        :style="{ width: hullIntegrity + '%' }"></div>
                                </div>
                            </div>
                        </div>

                        <div v-if="currentStage === 1"
                            class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-gradient-to-b from-cyan-400 via-blue-500 to-indigo-900 overflow-hidden">
                            
                            <!-- DEKORASI BAWAH LAUT (ANIMASI & ELEMEN) -->
                            <!-- Efek Cahaya Matahari dari Atas (Sun Rays) -->
                            <div class="absolute top-0 inset-x-0 h-40 bg-gradient-to-b from-white/20 to-transparent blur-xl pointer-events-none"></div>

                            <!-- Gelembung Air Animasi (Menggunakan Emoji / Efek Pulsate) -->
                            <div class="absolute bottom-20 left-[15%] text-2xl opacity-40 animate-bounce select-none pointer-events-none">🫧</div>
                            <div class="absolute bottom-40 right-[20%] text-4xl opacity-30 animate-pulse select-none pointer-events-none">🫧</div>
                            <div class="absolute top-1/3 left-[25%] text-xl opacity-20 animate-bounce select-none pointer-events-none">🫧</div>
                            <div class="absolute top-1/4 right-[10%] text-3xl opacity-40 animate-pulse select-none pointer-events-none">🫧</div>

                            <!-- 🦀 KEPITING / KETAM (Berada di dasar pasir) -->
                            <div class="absolute bottom-4 left-[20%] text-5xl animate-bounce select-none pointer-events-none duration-1000">🦀</div>
                            <div class="absolute bottom-2 right-[25%] text-4xl opacity-80 select-none pointer-events-none transform -scale-x-100">🦀</div>

                            <!-- 🐠 🐟 IKAN-IKAN (Berenang di tengah laut) -->
                            <div class="absolute top-1/4 left-[8%] text-5xl animate-pulse select-none pointer-events-none">🐠</div>
                            <div class="absolute top-1/3 right-[12%] text-6xl animate-bounce select-none pointer-events-none transform -scale-x-100">🐟</div>
                            <div class="absolute bottom-1/3 left-[12%] text-4xl opacity-70 select-none pointer-events-none">🐡</div>

                            <!-- 🐴🌊 KUDA LAUT (Berang-berang / Kuda Laut versi Emoji Tradisional biasanya menggunakan kombinasi unik atau ikon vertikal, kita gunakan emoji naga air/ikan hias yang mirip) -->
                            <div class="absolute top-1/2 left-[5%] text-5xl animate-bounce select-none pointer-events-none opacity-90">🐉</div>
                            <div class="absolute top-1/4 right-[5%] text-4xl animate-pulse select-none pointer-events-none opacity-80">🦑</div>

                            <!-- Lantai Pasir Laut di Bagian Bawah -->
                            <div class="absolute bottom-0 w-full h-24 bg-gradient-to-t from-amber-200 to-yellow-100/80 rounded-t-[50px] blur-[2px] opacity-80 pointer-events-none"></div>
                            <div class="grid grid-cols-4 gap-8">
                                <div v-for="(coral, i) in corals" :key="i" @click="restoreCoral(i)"
                                    class="text-8xl cursor-pointer transition-all duration-500 hover:scale-125 transform"
                                    :class="coral.restored ? 'drop-shadow-[0_0_20px_rgba(34,211,238,0.9)] scale-110' : 'grayscale brightness-50'">
                                    {{ coral.restored ? '🪸' : '🪸' }}
                                </div>
                            </div>
                        </div>

                        <div v-if="currentStage === 2" class="absolute inset-0 z-30">
                            <div v-for="(spill, i) in oilSpills" :key="i" @mouseover="cleanOil(i)"
                                class="absolute bg-black/80 rounded-full cursor-crosshair border-2 border-purple-500/30 flex items-center justify-center transition-all duration-100"
                                :style="{ 
                                left: spill.x + '%', 
                                top: spill.y + '%', 
                                width: spill.size + 'px', 
                                height: spill.size + 'px',
                                boxShadow: 'inset 0 0 30px rgba(168, 85, 247, 0.4)'
                            }">
                                <span v-if="spill.size > 80"
                                    class="text-[8px] text-purple-400 font-bold animate-pulse">TOXIC</span>
                            </div>
                        </div>

                        <div v-if="currentStage === 3" @mousemove="updatePointerPos"
                            class="absolute inset-0 z-30 cursor-none">
                            <div class="absolute inset-0 bg-yellow-900/20 pointer-events-none transition-opacity duration-1000"
                                :style="{ opacity: trashInSea.length / 10 }"></div>

                            <div class="absolute inset-0 pointer-events-none"
                                :style="{ background: `radial-gradient(circle at ${beeX}px ${beeY}px, transparent 80px, rgba(0,20,40,0.9) 200px)` }">
                            </div>

                            <div v-for="(trash, i) in trashInSea" :key="'sea-trash-'+i" @mouseover="vacuumTrash(i)"
                                class="absolute text-5xl transition-all duration-300"
                                :style="{ left: trash.x + '%', top: trash.y + '%', transform: `rotate(${trash.rot}deg)` }">
                                {{ trash.icon }}
                            </div>

                            <div v-for="jelly in jellyfish" class="absolute text-6xl animate-bounce"
                                :style="{ left: jelly.x + '%', top: jelly.y + '%', animationDuration: jelly.speed + 's' }">
                                🪼
                            </div>

                            <div class="absolute z-50 pointer-events-none transition-transform duration-100"
                                :style="{ left: (beeX - 50) + 'px', top: (beeY - 50) + 'px' }">
                                <div class="relative">
                                    <span class="text-7xl block">🛥</span>
                                    <div
                                        class="absolute -right-4 top-1/2 w-12 h-12 bg-cyan-400/30 rounded-full animate-ping">
                                    </div>
                                </div>
                            </div>

                            <div v-for="(trash, i) in trashInSea" 
                                :key="'sea-trash-'+i" 
                                v-if="!trash.collected" 
                                @mouseover="vacuumTrash(i)"
                                class="absolute text-5xl transition-all duration-300"
                                :style="{ left: trash.x + '%', top: trash.y + '%', transform: `rotate(${trash.rot}deg)` }">
                                {{ trash.icon }}
                            </div>
                            
                            <div
                                class="absolute bottom-6 right-6 bg-black/60 border-2 border-brand-green p-3 rounded-2xl text-white font-bold">
                                ♻️ Trash has been sucked up!: {{ cleanedTrashCount }} / 10
                            </div>
                        </div>

                        <div v-if="currentStage === 4"
                            class="absolute inset-0 z-30 flex flex-col items-center justify-center">
                            <div v-if="hullIntegrity < 50"
                                class="absolute inset-0 pointer-events-none border-[15px] border-red-600/20 z-50 transition-opacity"
                                :style="{ opacity: (100 - hullIntegrity) / 100 }">
                                <div class="w-full h-full border-[2px] border-red-500 animate-pulse"></div>
                            </div>

                            <div class="relative scale-150">
                                <div class="text-[120px] transition-transform duration-1000"
                                    :class="whaleFree ? 'translate-y-[-200px] opacity-0' : 'animate-bounce'">🐋</div>
                                <div v-if="!whaleFree" class="absolute inset-0 flex items-center justify-center">
                                    <span class="text-8xl text-slate-400/80 animate-pulse">🕸️</span>
                                </div>
                            </div>

                            <div class="flex gap-4 mt-20 relative z-[60]">
                                <button @click="cutNet"
                                    class="group relative px-8 py-4 bg-cyan-600 rounded-2xl font-black text-white shadow-[0_8px_0_#0891b2] active:translate-y-1 active:shadow-none transition-all">
                                    FREE THE WHALE ✂️
                                </button>
                                <button @click="repairHull"
                                    class="px-8 py-4 bg-red-600 rounded-2xl font-black text-white shadow-[0_8px_0_#991b1b] active:translate-y-1 active:shadow-none transition-all">
                                    FIX LEAKS 🛠️
                                </button>
                            </div>
                        </div>
                    </template>

                    <div v-if="currentStage >= 1"
                        class="absolute top-4 inset-x-0 z-[60] animate__animated animate__fadeInDown flex justify-center px-4">

                        <div class="bg-white/90 backdrop-blur px-6 py-2 rounded-full shadow-lg border-2 border-brand-green font-bold text-slate-700 flex items-center gap-3">
                            <span class="relative flex h-3 w-3">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-green opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-3 w-3 bg-brand-green"></span>
                            </span>
                            <span>{{ currentInstruction }}</span>
                        </div>

                        <button v-if="isGameOver" 
                                @click="restartGame"
                                class="bg-brand-green hover:bg-brand-green/90 text-white font-bold px-6 py-2 rounded-full shadow-md hover:shadow-lg transition-all duration-200 flex items-center gap-2 transform hover:scale-105">
                            
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.253 8H18" />
                            </svg>
                            
                            Play Again
                        </button>
                    </div>


                    <div v-if="stageComplete"
                        class="absolute inset-0 flex items-center justify-center z-[200] bg-white/20 backdrop-blur-[2px] animate__animated animate__fadeIn">

                        <div
                            class="text-center p-8 bg-white rounded-3xl shadow-2xl border-4 border-brand-blue animate__animated animate__bounceIn">

                            <h3 class="text-3xl font-bold text-brand-blue mb-4">Mission Success! 🌟</h3>

                            <button @click="nextStage"
                                class="px-10 py-4 rounded-full bg-brand-blue text-white text-2xl font-bold shadow-[0_6px_0_#1E40AF] hover:translate-y-1 transition-all">

                                {{ (currentStage === 4) ? 'Finish Adventure! 🏆' : 'Next Mission ➡️' }}
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="scripts/scripts.js"></script>
</body>

</html>
